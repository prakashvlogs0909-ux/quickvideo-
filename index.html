<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickVideo</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
margin:0;
min-height:100vh;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px
}

.container{
width:100%;
max-width:650px;
text-align:center
}

.logo{
font-size:38px;
font-weight:bold;
margin-bottom:10px
}

.logo span{color:#38bdf8}

.subtitle{
color:#94a3b8;
margin-bottom:30px
}

.card{
background:#1e293b;
padding:30px;
border-radius:20px
}

input{
width:100%;
padding:16px;
margin-top:20px;
border:1px solid #475569;
border-radius:12px;
background:#0f172a;
color:white;
font-size:15px
}

button{
width:100%;
padding:16px;
margin-top:12px;
border:0;
border-radius:12px;
background:#38bdf8;
color:#082f49;
font-weight:bold;
font-size:16px
}

#message{
margin-top:18px;
color:#cbd5e1
}
</style>
</head>

<body>

<div class="container">

<div class="logo">⚡ Quick<span>Video</span></div>

<div class="subtitle">
Download videos you are authorized to download
</div>

<div class="card">

<h2>Paste Video Link</h2>

<input
type="url"
id="videoUrl"
placeholder="https://example.com/video.mp4">

<button onclick="downloadVideo()">
Download
</button>

<div id="message"></div>

</div>

</div>

<script>
function downloadVideo(){

const url=document.getElementById("videoUrl").value.trim();
const message=document.getElementById("message");

if(!url){
message.innerText="⚠️ Please paste a video URL.";
return;
}

if(!url.toLowerCase().includes(".mp4")){
message.innerText="⚠️ Please use an authorized direct .mp4 video link.";
return;
}

const link=document.createElement("a");
link.href=url;
link.download="video.mp4";
link.target="_blank";

document.body.appendChild(link);
link.click();
document.body.removeChild(link);

message.innerText="✅ Download started.";
}
</script>

</body>
</html>
